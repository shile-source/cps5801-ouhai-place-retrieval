<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新增地点 · 60条抽查</title><style>body{font:18px/1.65 system-ui;background:#f2f6f3;color:#193d31;margin:0}main{max-width:900px;margin:25px auto;padding:25px;background:white;border-radius:12px}h1{font-size:27px}h2{font-size:22px}pre{font:inherit;white-space:pre-wrap;background:#eef4ee;padding:16px}input,textarea,button{font:inherit;padding:8px}textarea{width:95%;min-height:70px}button{margin:8px 8px 8px 0}label{display:block;margin:15px 0}#progress,#message{background:#fff1d0;padding:12px}fieldset{border:0;padding:0}a{color:#196c50}</style><main><h1>新增类别 · 人工抽查60条</h1><p>你提交的30条请求 × 151条来源候选，共4,530条辅助规则建议。这里只抽查60对（每个请求随机2对），不需要你全部重评。未抽查的建议不会记为真人评分；本次抽查也不能证明整批建议都正确。</p><p>2＝来源充分支持；1＝明确部分相关；0＝明确不匹配；未知＝资料不足。缺少体验、设备或营业证据时可保留未知，不要凭公园、商场等类别猜测。你可以修改建议。</p><div id="progress">读取中…</div><div id="message" role="status"></div><label>你的代号 <input id="reviewer" maxlength="80"></label><h2 id="query"></h2><h2 id="name"></h2><pre id="source"></pre><a id="link" target="_blank" rel="noopener noreferrer">原始来源 ↗</a><pre id="suggestion"></pre><p id="existing"></p><fieldset id="form"><label>你的判断依据<textarea id="reason" maxlength="2000"></textarea></label><label><input id="confirmed" type="checkbox">我已查看本条并亲自判断。</label><button id="accept">采用建议并保存</button><button data-grade="0">0 不相关</button><button data-grade="1">1 部分相关</button><button data-grade="2">2 高度相关</button><button id="unknown">资料不足</button></fieldset><button id="prev">上一条（不保存）</button><button id="next">下一条（不保存）</button><button id="continue">继续未处理</button><button id="lock">完成60条并锁定</button><p>点击判断按钮成功后自动保存到D盘并进入下一条，可分次完成。原评分与本次建议均保留历史。仅填写文字、勾选不算已保存。</p></main><script>
let state,index=0,token='';const $=x=>document.getElementById(x),grade=x=>x===null?'未知（资料不足）':x;
$('reviewer').value=localStorage.getItem('spotcheck_alias')||'';
async function load(i){try{const r=await fetch('/api/state?index='+i);const s=await r.json();if(!r.ok)throw Error(s.error);state=s;index=i;token=s.request_token;$('progress').textContent=`人工抽查已保存 ${s.handled}/${s.total}，当前第${i+1}条`+(s.locked?'；已锁定':'');$('query').textContent=s.item.query_id+'：'+s.item.query;$('name').textContent=s.item.record.name+' · '+s.item.record.category;$('source').textContent='来源地址：'+(s.item.record.address||'未知')+'\n'+s.item.record.description;$('suggestion').textContent='辅助规则建议：'+grade(s.item.ai_suggestion.grade)+'\n'+s.item.ai_suggestion.basis;const u=s.item.record.source_url||'';$('link').hidden=!/^https?:\/\//.test(u);if(!$('link').hidden)$('link').href=u;$('existing').textContent=s.existing?'已有你的决定：'+grade(s.existing.grade)+'；'+s.existing.reason:'尚未抽查';$('reason').value='';$('confirmed').checked=false;$('form').disabled=s.locked;$('lock').disabled=s.locked||s.handled!==s.total;$('prev').disabled=i===0;$('next').disabled=i===s.total-1;}catch(e){$('message').textContent='读取失败：'+e.message}}
async function post(path,value){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(value)});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
async function save(g){try{await post('/api/decision',{case_id:state.item.case_id,grade:g,reason:$('reason').value,reviewer:$('reviewer').value,confirmed:$('confirmed').checked});localStorage.setItem('spotcheck_alias',$('reviewer').value);const s=await(await fetch('/api/state?index='+index)).json();$('message').textContent='本条已保存到D盘';await load(s.next_unhandled===null?index:s.next_unhandled)}catch(e){$('message').textContent='尚未保存：'+e.message}}
$('accept').onclick=()=>save(state.item.ai_suggestion.grade);document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>save(Number(b.dataset.grade)));$('unknown').onclick=()=>save(null);$('prev').onclick=()=>load(index-1);$('next').onclick=()=>load(index+1);$('continue').onclick=()=>load(state.next_unhandled===null?index:state.next_unhandled);$('lock').onclick=async()=>{try{await post('/api/finalize',{});await load(index);$('message').textContent='60条抽查已锁定。'}catch(e){$('message').textContent=e.message}};load(0);
</script></html>
