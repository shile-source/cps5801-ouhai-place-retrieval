function updateOverview(rows) {
    const svg = $('placeOverview');
    svg.replaceChildren();
    const legend = $('pointLegend');
    legend.replaceChildren();
    const points = rows.filter(row => row.map_preview);
    $('overviewNote').hidden = false;
    $('overviewNote').textContent = language === 'en'
        ? `${points.length} source positions in this view. Select a marker or a name below; nearby markers may overlap. This overview has no street basemap; positions and entrances remain unverified.`
        : `当前视图有${points.length}个来源点位。可点击标记或下方名称；相近点位可能重叠。概览不含街道底图，位置及入口仍待核验。`;
    svg.setAttribute('aria-label', language === 'en' ? 'Source location overview; select a place' : '来源点位概览，选择地点');
    legend.hidden = !points.length;
    if (!points.length) {svg.setAttribute('hidden', ''); return;}
    svg.removeAttribute('hidden');
    const make = (tag, attrs, text) => {
        const item = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const [key, value] of Object.entries(attrs)) item.setAttribute(key, value);
        if (text !== undefined) item.textContent = text;
        return item;
    };
    const cosine = Math.cos(points.reduce((sum, r) => sum + r.map_preview.latitude, 0) / points.length * Math.PI / 180);
    const xs = points.map(r => r.map_preview.longitude * cosine), ys = points.map(r => r.map_preview.latitude);
    const xmin = Math.min(...xs), xmax = Math.max(...xs), ymin = Math.min(...ys), ymax = Math.max(...ys);
    const scale = Math.min(660 / Math.max(xmax - xmin, .001), 240 / Math.max(ymax - ymin, .001));
    const positions = points.map((row, i) => ({
        x:60 + (660 - (xmax - xmin) * scale) / 2 + (xs[i] - xmin) * scale,
        y:55 + (240 - (ymax - ymin) * scale) / 2 + (ymax - ys[i]) * scale,
    }));
    svg.append(make('text', {x:18,y:24}, language === 'en' ? 'N ↑ · source positions' : '北 ↑ · 来源点位'));
    points.forEach((row, i) => {
        const {x, y} = positions[i];
        const label = `${i+1}. ${row.name}`;
        const marker = make('circle', {cx:x,cy:y,r:8,tabindex:0,role:'button','aria-label':label,'data-poi-id':row.poi_id});
        marker.append(make('title', {}, label));
        marker.addEventListener('click', () => selectPlace(row));
        marker.addEventListener('keydown', event => {if (event.key === 'Enter' || event.key === ' ') {event.preventDefault(); selectPlace(row);}});
        svg.append(marker);
        if (!positions.some((p,j) => j!==i && Math.hypot(p.x-x,p.y-y)<24))
            svg.append(make('text', {x:x+12,y:y+4,'pointer-events':'none'}, String(i+1)));
        const choice = node('button', label);
        choice.type = 'button';
        choice.title = row.poi_id;
        choice.addEventListener('click', () => selectPlace(row));
        legend.append(choice);
    });
}

    $('placeText').placeholder = en ? 'Enter Chinese words, such as 书房 or 潘桥' : '输入书房、潘桥等关键词';
    $('placeCategoryLabel').textContent = en ? 'Source category' : '来源类别';
    $('previewOnlyLabel').textContent = en ? 'With a source map point' : '有来源地图标记';
    const selected = $('placeCategory').value;
    $('placeCategory').replaceChildren();
    const all = node('option', en ? 'All categories' : '全部类别');
    all.value = '';
    $('placeCategory').append(all);
    const categories = [...new Set((inventoryRows || []).map(row => row.category).filter(Boolean))].sort();
    for (const category of categories) {
        const option = node('option', category);
        option.value = category;
        $('placeCategory').append(option);
    }

function updateInventory() {
    $('browsePlaces').textContent = inventoryCopy[language].button;
    $('inventoryNote').textContent = inventoryCopy[language].note;
    if (!inventoryRows) return;
    $('placeFilters').hidden = false;
    const words = $('placeText').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    const category = $('placeCategory').value;
    const rows = inventoryRows.filter(row => {
        const text = [row.name, row.address, row.category, row.description].join('\n').toLocaleLowerCase();
        return words.every(word => text.includes(word))
            && (!category || row.category === category)
            && (!$('previewOnly').checked || Boolean(row.map_preview));
    });
    $('placeCount').textContent = language === 'en'
        ? `${rows.length} of ${inventoryRows.length} source records shown`
        : `显示 ${rows.length} / ${inventoryRows.length} 条来源记录`;
    const target = $('inventory');
    target.replaceChildren();
    if (!rows.length) target.append(node('p', language === 'en'
        ? 'No records match these filters. Try fewer words or another category.'
        : '当前条件没有匹配记录，可减少关键词或更换类别。'));
    for (const row of rows) {
        const article = node('article', undefined, 'result');
        article.append(node('h3', row.name), node('p', row.category + ' | ' + (row.address || t('missing'))));
        article.append(node('p', row.description, 'description'));
        const button = node('button', mapCopy[language].select);
        button.type = 'button';
        button.addEventListener('click', () => selectPlace(row));
        article.append(button);
        target.append(article);
    }
    updateOverview(rows);
}
$('placeText').addEventListener('input', updateInventory);
$('placeCategory').addEventListener('change', updateInventory);
$('previewOnly').addEventListener('change', updateInventory);
$('routeForm').addEventListener('submit', event => {

$('browsePlaces').addEventListener('click', async () => {
    const target = $('inventory');
    target.hidden = false;
    target.textContent = inventoryCopy[language].loading;
    try {
        const response = await fetch('/api/places', {cache:'no-store'});

function updateMapLabels() {
    const copy = mapCopy[language];
    $('mapTitle').textContent = copy.title + ' · ' + selectedPlace.name;
    $('mapAddress').textContent = selectedPlace.address || t('missing');
    $('mapHint').textContent = selectedPlace.address ? copy.addressHint : copy.nameHint;
    const en = language === 'en';
    $('previewNote').textContent = selectedPlace.point
        ? (en ? 'OpenStreetMap source location. The entrance is still unverified.' : '地图标记来自 OpenStreetMap，实际入口仍待核验。')
        : (en ? 'Map preview unavailable for this record. Use the address or name to find it in Baidu Maps.' : '该记录暂无可预览的地图标记，可用地址或名称在百度地图中查找。');
    $('loadMapPreview').textContent = en ? 'Load OpenStreetMap preview' : '加载 OpenStreetMap 地图';
    $('previewFallback').textContent = en ? 'If the street tiles stay blank, use the map links below. The source-point overview also works without external tiles.' : '若街道底图一直空白，可使用下方地图入口；来源点位概览不依赖外部瓦片。';
    $('openAmap').textContent = en ? 'Find on Amap' : '在高德地图上查找';
    $('photoNote').textContent = en ? 'Photos are not included in this local source record. Check the matched provider listing for any available photos.' : '本地来源记录未包含照片，可在地图服务商匹配的地点详情中查看是否有照片。';
    $('destinationEvidenceTitle').textContent = en ? 'Destination source details' : '目的地来源详情';
    const nav = selectedPlace.navigation;
    $('destinationEvidence').textContent = (nav?.has_supplement
        ? (en ? 'Navigation address from a separate publisher notice; retrieval text and the frozen evaluation remain unchanged. ' : '导航地址来自单独核查的馆方公告，检索文本和冻结评分数据保持原样。')
        : (en ? 'Destination uses the source-reported address, or a name search when no address is recorded. ' : '目的地使用来源地址；缺失地址时按名称搜索。'))
        + (nav?.source_checked_on ? (en ? 'Source checked: ' : '来源核查日期：') + nav.source_checked_on + '. ' : '')
        + (selectedPlace.point ? `WGS84: ${selectedPlace.point.latitude}, ${selectedPlace.point.longitude}. ` : '')
        + (en ? 'Confirm the provider’s matched place and entrance before traveling.' : '出发前核对服务商匹配的地点及实际入口。');
    for (const [id, key] of Object.entries({openMap:'map',mapSource:'source',originLabel:'origin',modeLabel:'mode',openRoute:'route'})) {
        $(id).textContent = copy[key];
    }
    $('routeOrigin').placeholder = copy.placeholder;
    for (const option of $('routeMode').options) option.textContent = copy[option.value];
}
$('loadMapPreview').addEventListener('click', () => {
    const point = selectedPlace?.point;
    if (!point) return;
    const {latitude: lat, longitude: lon} = point;
    const url = new URL('https://www.openstreetmap.org/export/embed.html');
    url.search = new URLSearchParams({
        bbox: [lon - 0.004, lat - 0.003, lon + 0.004, lat + 0.003].join(','),
        marker: [lat, lon].join(','),
        layer: 'mapnik',
    });
    $('mapPreview').src = url.href;
    $('mapPreview').hidden = false;
    $('previewFallback').hidden = false;
    $('loadMapPreview').hidden = true;
});
function selectPlace(row) {
    const name = row.name.trim();
    const address = (row.navigation?.address ?? row.address ?? '').trim();
    const source = row.navigation?.address_source_url || row.source_url || '';
    selectedPlace = {name, address, point: row.map_preview, navigation: row.navigation};
    $('mapPreview').hidden = true;
    $('mapPreview').removeAttribute('src');
    $('previewFallback').hidden = true;
    $('loadMapPreview').hidden = !selectedPlace.point;
    const url = new URL('https://api.map.baidu.com/place/search');
    url.search = new URLSearchParams({query:[name,address].filter(Boolean).join(' '),region:'瓯海区',output:'html',src:'webapp.cps5801.placesearch'});
    $('openMap').href = row.navigation?.search_links?.baidu || url.href;
    const amap = new URL('https://uri.amap.com/search');
    amap.search = new URLSearchParams({keyword:'温州市瓯海区 '+[name,address].filter(Boolean).join(' '),city:'温州',view:'map',src:'cps5801'});
    $('openAmap').href = row.navigation?.search_links?.amap || amap.href;
    $('routeDestination').value = address || '温州市瓯海区' + name;
    $('mapSource').hidden = !/^https?:\/\//i.test(source);
    if ($('mapSource').hidden) $('mapSource').removeAttribute('href');
    else $('mapSource').href = source;
    updateMapLabels();
    $('mapPanel').hidden = false;
    $('mapPanel').scrollIntoView({block:'nearest'});
}
for (const mode of ['walking', 'transit', 'driving']) {

function showStatus(){ $('status').textContent=backend?`${t('connected')} · ${backend.candidate_count} ${t('candidates')} · BM25 ${t('ready')} · Encoder ${t(backend.encoder_state==='disabled'?'disabled':backend.encoder_state==='stopped'?'stopped':backend.encoder_ready?'ready':'onDemand')} ${backend.bge_available?' · BGE-M3 '+t(backend.dense_states?.bge_m3==='disabled'?'disabled':backend.dense_states?.bge_m3==='ready'?'ready':backend.dense_states?.bge_m3==='stopped'?'stopped':'onDemand'):''} · C: ${backend.disk_free_gib.C} GiB / D: ${backend.disk_free_gib.D} GiB${backend.disk_free_gib.C<backend.encoder_min_c_gib?' · '+t('guard'):''}`:t('connecting'); }
async function status(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();backend=await r.json();for(const id of ['encoder','bge_m3','both'])$(id).disabled=backend.encoder_enabled===false;$('hardFilterPanel').hidden=!backend.explicit_hard_filter_available;$('bge_m3').hidden=!backend.bge_available;$('bge_m3Result').hidden=!backend.bge_available;showStatus();for(const element of document.querySelectorAll('[data-t]'))element.textContent=t(element.dataset.t);}catch(e){$('status').textContent=t('statusFailed');}}
function render(method,data){const target=$(method+'Result').querySelector('.content');target.replaceChildren();target.className='content';target.append(node('p',t('query')+': '+data.query),node('p',`${t('searchTime')}: ${data.search_ms.toFixed(2)} ms | ${t('loadTime')}: ${data.load_ms.toFixed(2)} ms | ${t('totalTime')}: ${data.elapsed_ms.toFixed(2)} ms`,'muted'),node('p',t('request')+' '+data.request_id+' · '+data.executed_at,'id'));if(data.hard_filter)target.append(node('p',t('filterResult')+': '+data.hard_filter.eligible_ids.length+' / '+data.hard_filter.unknown_ids.length+' / '+data.hard_filter.unmet_ids.length,'notice'));target.append(node('div',t(data.hard_filter?'filterWarning':'warning'),'notice'));if(/安静|学习/.test(data.query))target.append(node('div',t('quiet'),'notice'));if(['keyword','bm25'].includes(method)&&data.results.length&&data.results.every(r=>r.score===0))target.append(node('div',t('zeroWarning'),'notice')); const visibleResults = ['keyword','bm25'].includes(method) ? data.results.filter(row => row.matched_tokens.length > 0) : data.results; for(const row of visibleResults){const article=node('article',undefined,'result');article.append(node('h3',row.rank+'. '+row.name),node('div',t('score')+': '+row.score.toFixed(6),'score'),node('div',row.poi_id,'id'),node('p',`${t('category')}: ${row.category||t('missing')} | ${t('address')}: ${row.address||t('missing')}`),node('p',row.description||t('noDescription'),'description'),node('p',['keyword','bm25'].includes(method)?t('matches')+': '+(row.matched_tokens.join(', ')||t('zero')):t('cosine'),'muted'),node('p',t('verification'),'muted'));if (row.name.trim()) {

Object.assign(translations.en,{filterTitle:'Optional required conditions',filterHelp:'Use only mandatory conditions. Leave preferences in the query. Exact source category and recorded counts are checked; unknown facts are excluded. This does not confirm current conditions.',filterCategory:'Exact recorded category',filterSeats:'Recorded seats at least',filterHoldings:'Recorded books at least',filterResult:'Source filter: eligible / unknown / unmet',filterWarning:'Required conditions were applied to recorded source facts; unknown facts were excluded. This does not verify current operations, fees, distance or quietness.'});

function explicitConstraints(){if(!backend?.explicit_hard_filter_available)return [];const out=[];const category=$('hardCategory').value.trim();if(category)out.push({field:'category',operator:'eq',value:category});for(const [id,field] of [['hardSeats','seats'],['hardHoldings','holdings']]){const value=$(id).value.trim();if(value)out.push({field,operator:'gte',value:Number(value)});}return out;}
function setLanguage(value){language=value;document.documentElement.lang=value==='en'?'en':'zh-CN';document.title=t('title');for(const element of document.querySelectorAll('[data-t]'))element.textContent=t(element.dataset.t);$('query').placeholder=t('placeholder');showStatus();updateExplore();updatePlaceFilters();updateInventory();for(const method of methods){if(results[method])render(method,results[method]);else{const target=$(method+'Result').querySelector('.content');target.textContent=errors[method]?t('failed')+' '+errors[method]:t('waiting');}}}
async function run(method, requestedQuery, requestedConstraints){const constraints=requestedConstraints??explicitConstraints();const query=requestedQuery ?? $('query').value.trim();if(!query){$('query').focus();return;}const identity=JSON.stringify([query,constraints]);for(const other of methods)if(lastQuery[other]!==null&&lastQuery[other]!==identity){delete results[other];delete errors[other];$(other+'Result').querySelector('.content').textContent=t('changed');lastQuery[other]=null;}lastQuery[method]=identity;delete results[method];delete errors[method];const target=$(method+'Result').querySelector('.content');target.className='content busy';target.textContent=t('loading');busy++;$('query').readOnly=true;$('hardFilterFields').disabled=true;for(const b of [...document.querySelectorAll('#keyword,#bm25,#encoder,#both,[data-query]'),$('bge_m3')])b.disabled=true;try{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,query,constraints}),cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.code==='STORAGE_GUARD'?t('guard'):(language==='en'?'Backend error (HTTP '+r.status+'). '+t('technical')+': '+(data.error||''):data.error));if(data.query!==query||data.saved_results_used!==false||data.live_computation!==true)throw Error(t('inconsistent'));results[method]=data;render(method,data);}catch(e){errors[method]=e.message;target.className='content error';target.textContent=t('failed')+'\n'+e.message;}finally{busy--;if(!busy){$('query').readOnly=false;$('hardFilterFields').disabled=false;for(const b of [...document.querySelectorAll('#keyword,#bm25,#encoder,#both,[data-query]'),$('bge_m3')])b.disabled=false;}status();}}
$('suggestConditions').addEventListener('click',async()=>{if(busy)return;const query=$('query').value.trim();if(!query){$('query').focus();return;}busy++;$('suggestConditions').disabled=true;$('query').readOnly=true;$('hardFilterFields').disabled=true;for(const id of ['keyword','bm25','encoder','bge_m3','both'])$(id).disabled=true;try{const response=await fetch('/api/constraints/propose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});const value=await response.json();if(!response.ok)throw Error(value.error);for(const id of ['hardCategory','hardSeats','hardHoldings'])$(id).value='';const ids={category:'hardCategory',seats:'hardSeats',holdings:'hardHoldings'};for(const item of value.constraints)if(ids[item.field])$(ids[item.field]).value=String(item.value);for(const method of methods){delete results[method];delete errors[method];lastQuery[method]=null;$(method+'Result').querySelector('.content').textContent=t('changed');}$('constraintProposal').textContent=t('suggestReady');}catch(error){$('constraintProposal').textContent=t('suggestFailed');}finally{busy--;$('suggestConditions').disabled=false;$('query').readOnly=false;$('hardFilterFields').disabled=false;for(const id of ['keyword','bm25','encoder','bge_m3','both'])$(id).disabled=false;await status();}});
$('language').addEventListener('change',e=>{setLanguage(e.target.value);if(!document.getElementById('mapPanel').hidden)updateMapLabels();});$('keyword').addEventListener('click',()=>run('keyword'));$('bm25').addEventListener('click',()=>run('bm25'));$('encoder').addEventListener('click',()=>run('encoder'));$('bge_m3').addEventListener('click',()=>run('bge_m3'));$('both').addEventListener('click',async()=>{const query=$('query').value.trim();if(!query){$('query').focus();return;}const conditions=explicitConstraints();for(const method of (backend?.bge_available?methods:['keyword','bm25','encoder']))await run(method,query,conditions);});for(const b of document.querySelectorAll('[data-query]'))b.addEventListener('click',()=>{$('query').value=b.dataset.query;});setLanguage('en');status();
