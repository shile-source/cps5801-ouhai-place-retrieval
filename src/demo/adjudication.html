<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPS5801 最后12对复核</title>
<style>body{font:17px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;background:#f3f6f5;color:#193c3a;margin:0}main{max-width:900px;margin:auto;padding:24px}section{background:white;border:1px solid #d9e3df;border-radius:10px;padding:22px;margin:18px 0}h1{font-size:25px}h2{font-size:21px}button,input,textarea{font:inherit}input[type=text],textarea{width:100%;box-sizing:border-box;border:1px solid #9fb5ad;border-radius:6px;padding:10px}textarea{min-height:105px;margin:8px 0}button{padding:12px 17px;margin:6px 7px 6px 0;border:1px solid #9db5ab;background:#eef5f0;border-radius:6px;color:#18483b;cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#176650;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.muted{color:#5c7169;font-size:15px}#message{font-weight:600;white-space:pre-wrap}a{color:#126554}details{margin:16px 0}label{display:block}#progress{font-size:22px;font-weight:bold}</style>
<main><h1>CPS5801 最后12对复核</h1><p>这是你本人对既有分歧的后续复核，不是新增独立盲评。原来的两份评分和已发布结果都保留。只看来源文字判断；不猜照片、安静程度或当前营业。无法确定时保留资料不足。</p>
<section><label for="reviewer">你的复核者代号</label><input id="reviewer" type="text" maxlength="80" autocomplete="off"><label><input id="confirmed" type="checkbox">我会亲自依据来源判断，并填写理由。</label><p class="muted">点击0／1／2或资料不足后才保存，成功后自动进入下一对。仅输入文字还没有提交。可关闭后继续。</p></section>
<section><p id="progress"></p><h2 id="query"></h2><p id="rubric"></p><h2 id="place"></h2><pre id="facts"></pre><a id="source" target="_blank" rel="noopener noreferrer">打开原始来源</a><details><summary>查看两份原评分与理由</summary><pre id="opinions"></pre></details><p id="existing" class="muted"></p>
<label for="reason">本次判断依据；若资料不足，请写缺少什么事实</label><textarea id="reason" maxlength="2000" placeholder="例如：名称与查询指向不同地点；或缺少座位数，仍无法判断。"></textarea>
<div id="grades"><button data-grade="0">0 不相关</button><button data-grade="1">1 部分相关</button><button data-grade="2">2 高度相关</button><button data-grade="unknown">资料不足，保留未知</button></div>
<p id="message" role="status" aria-live="polite"></p><button id="previous">上一对</button><button id="next">下一对（不保存）</button><button id="unhandled">继续下一对未处理</button></section>
<section><h2>全部复核后</h2><p>完成12对后，点击下方按钮锁定本次复核，再告诉我已经完成。资料不足也算已处理，不必强行给分。</p><button id="finalize" class="primary" disabled>确认完成并锁定本次复核</button><a href="/api/export" target="_blank">查看本次保存记录</a></section></main>
<script>
const $=id=>document.getElementById(id);let state=null,token='',busy=false,index=0,loadSerial=0;
function buttons(disabled){for(const b of document.querySelectorAll('#grades button'))b.disabled=disabled;for(const id of ['previous','next','unhandled'])$(id).disabled=busy;}
async function load(i){const serial=++loadSerial;const r=await fetch('/api/state?index='+i,{cache:'no-store'});const v=await r.json();if(!r.ok)throw Error(v.error);if(serial!==loadSerial)return;state=v;token=v.request_token;index=i;const x=v.item;$('progress').textContent=`已复核 ${v.handled}／${v.total} 对；仍资料不足 ${v.unknown} 对；当前第 ${i+1} 对`;$('query').textContent=x.query.text;$('rubric').textContent=x.query.rubric;$('place').textContent=x.candidate.name;$('facts').textContent=`类别：${x.candidate.category||'未知'}\n地址（来源记载）：${x.candidate.address||'未知'}\n来源描述：${x.candidate.description||'未提供'}`;const link=x.candidate.source_url||'';$('source').hidden=!/^https?:\/\//i.test(link);if(!$('source').hidden)$('source').href=link;else $('source').removeAttribute('href');const show=g=>g===null?'资料不足':String(g);$('opinions').textContent=`原A：${show(x.original.first_grade)}\n依据：${x.original.first_evidence||x.original.first_unknown_reason||'未填写'}\n\n原B：${show(x.original.second_grade)}\n依据：${x.original.second_evidence||x.original.second_unknown_reason||'未填写'}`;$('reason').value=v.existing?.reason||'';$('existing').textContent=v.existing?`本对已保存：${show(v.existing.grade)}；${v.existing.saved_at}`:'本对尚未复核';$('reason').disabled=v.locked;$('finalize').disabled=v.locked||v.handled!==v.total;buttons(v.locked||busy);if(v.locked)$('message').textContent='本次12对复核已完成并锁定，可以告诉我了。';}
async function post(path,value){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(value)});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
for(const b of document.querySelectorAll('#grades button'))b.addEventListener('click',async()=>{if(busy)return;busy=true;buttons(true);try{const grade=b.dataset.grade==='unknown'?null:Number(b.dataset.grade);const saved=await post('/api/decision',{case_id:state.item.case_id,grade,reason:$('reason').value,reviewer:$('reviewer').value,confirmed:$('confirmed').checked});$('message').textContent='已保存到本机D盘：'+saved.event.saved_at;await load(index);if(state.next_unhandled!==null)await load(state.next_unhandled);else $('message').textContent='12对全部已保存，请点击下方“确认完成并锁定本次复核”。';}catch(e){$('message').textContent='未保存：'+e.message;}finally{busy=false;buttons(state?.locked||false);}});
$('previous').onclick=()=>{if(!busy&&index>0)load(index-1).catch(e=>$('message').textContent=e.message)};$('next').onclick=()=>{if(!busy&&index+1<state.total)load(index+1).catch(e=>$('message').textContent=e.message)};$('unhandled').onclick=()=>{if(!busy&&state.next_unhandled!==null)load(state.next_unhandled).catch(e=>$('message').textContent=e.message)};
$('finalize').onclick=async()=>{if(busy)return;busy=true;buttons(true);try{await post('/api/finalize',{});await load(index);}catch(e){$('message').textContent=e.message;}finally{busy=false;buttons(state.locked);}};
load(0).then(()=>{if(state.next_unhandled!==null&&state.next_unhandled!==0)return load(state.next_unhandled)}).catch(e=>$('message').textContent='加载失败：'+e.message);
</script></html>
